<style>
  /* Sistema de Bahía Shops: fondo cálido, tinta, azul de acento, celeste secundario */
  :root{
    --bg:#faf9f7; --ink:#0a0a0a; --accent:#4164fe; --celeste:#9cc3ea;
    --muted:rgba(10,10,10,.55); --line:rgba(10,10,10,.12);
    --display:'Fraunces', Georgia, serif; --ui:'Inter', system-ui, sans-serif; --soft:'Poppins', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--ui);display:flex;flex-direction:column}
  header{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;
    padding:20px max(16px,4vw) 16px;border-bottom:1px solid var(--line)}
  h1{font-family:var(--display);font-weight:500;font-size:clamp(24px,3vw,34px);margin:0;letter-spacing:-.01em}
  .sub{font-family:var(--soft);font-weight:300;font-size:14px;color:var(--muted);margin:4px 0 0;max-width:52ch}
  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}
  .seg{display:inline-flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
  .seg button{font:500 13px var(--ui);background:transparent;color:var(--ink);border:0;padding:8px 14px;cursor:pointer}
  .seg button+button{border-left:1px solid var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .seg button:focus-visible,.toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .toggle{font:500 13px var(--ui);display:inline-flex;gap:8px;align-items:center;background:transparent;border:1px solid var(--line);
    border-radius:4px;padding:8px 12px;cursor:pointer;color:var(--ink)}
  .toggle .dot{width:10px;height:10px;border-radius:2px;border:1.5px solid var(--accent)}
  .toggle[aria-pressed="true"] .dot{background:var(--accent)}
  main{position:relative;flex:1;min-height:420px}
  #map{position:absolute;inset:0}
  .modo{position:absolute;left:16px;top:16px;z-index:3;display:flex;gap:4px;padding:4px;background:#fff;border-radius:999px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
  .modo button{font:600 13px var(--ui);border:0;background:transparent;color:var(--ink);padding:8px 16px;border-radius:999px;cursor:pointer}
  .modo button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .modo button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .lamp{position:absolute;left:16px;top:66px;z-index:3;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:var(--ink);
    display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.15)}
  .lamp svg{width:22px;height:22px}
  .lamp[aria-pressed="true"]{background:var(--ink);color:#fff}
  .lamp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .note{position:absolute;left:16px;bottom:28px;z-index:2;max-width:300px;background:var(--bg);border:1px solid var(--line);
    border-radius:16px;padding:14px 16px;font-size:13px;line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,.08)}
  .note b{font-family:var(--display);font-weight:500;font-size:16px;display:block;margin-bottom:4px}
  .legend{display:flex;gap:14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);flex-wrap:wrap}
  .legend span{display:inline-flex;gap:6px;align-items:center;font-size:12px}
  .legend svg{width:22px;height:26px}
  /* Pines */
.barrio-lbl{font:600 var(--bfs,12px)/1.1 var(--ui);white-space:pre-line;text-transform:uppercase;letter-spacing:.07em;color:var(--blbl,#fff);text-shadow:var(--bhalo,none);
    max-width:10em;text-align:center;pointer-events:none;z-index:0;transition:opacity .12s}
  .pin{z-index:1}
  .pin{cursor:pointer;transition:transform .15s ease;transform-origin:0 100%;background:none;border:0;padding:0}
  .pin:hover,.pin.on{transform:scale(1.18)}
  .pin svg{display:block;width:29px;height:42.4px}
  /* Ficha */
  /* Popup de tienda: el mismo diseño que ya está en el sitio */
  .maplibregl-popup.mapa-popup{max-width:360px!important;z-index:10}
  .mapa-popup .maplibregl-popup-content{padding:22px 24px 20px;border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.16);font-family:var(--ui)}
  .mapa-popup .maplibregl-popup-tip{border-top-color:#fff}
  .mapa-popup .maplibregl-popup-close-button{font-size:24px;font-weight:300;color:#9a9a9a;right:12px;top:10px;width:30px;height:30px;border-radius:50%}
  .mapa-popup .maplibregl-popup-close-button:hover{background:#f2f0ec;color:var(--ink)}
  .pop-head{display:flex;gap:14px;align-items:center;padding-right:24px}
  .pop-logo{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;flex:none;font:500 22px var(--display);color:rgba(10,10,10,.7)}
  .pop-name{font:700 18px/1.2 var(--ui);margin:0}
  .pop-meta{font:500 14px var(--ui);color:var(--accent);margin-top:3px}
  .pop-desc{font:400 15px/1.5 var(--ui);color:#8a8a8a;margin:14px 0 12px}
  .pop-link{font:600 15px var(--ui);color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
  .pop-link:hover{text-decoration:underline}
  .err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
  .maplibregl-ctrl-group{border-radius:8px!important;box-shadow:0 2px 10px rgba(0,0,0,.12)!important}
  @media (max-width:640px){ .note{right:16px;max-width:none} }
  @media (prefers-reduced-motion:reduce){ .pin{transition:none} }
</style>
</head>

function circulo(ll, metros){
  const pts=[], R=6371000, lat=ll[1]*Math.PI/180;
  for(let i=0;i<=48;i++){ const a=i/48*2*Math.PI;
    pts.push([ll[0]+(metros*Math.cos(a))/(R*Math.cos(lat))*180/Math.PI, ll[1]+(metros*Math.sin(a))/R*180/Math.PI]); }
  return {type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[pts]}};
}

    },

      {id:'green',type:'fill',source:'omt','source-layer':'landcover',filter:['match',['get','class'],['grass','wood'],true,false],paint:{'fill-color':s.park,'fill-opacity':.7}},
      {id:'water',type:'fill',source:'omt','source-layer':'water',paint:{'fill-color':s.water}},
      {id:'waterway',type:'line',source:'omt','source-layer':'waterway',paint:{'line-color':s.water,'line-width':1.2}},
      {id:'building',type:'fill',source:'omt','source-layer':'building',minzoom:14,paint:{'fill-color':s.building}},
      {id:'road-minor',type:'line',source:'omt','source-layer':'transportation',filter:['all',notTunnel,minors],
        layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':s.minor,'line-width':s.thin?w(.3,1.4):s.grid?w(.5,3.5):w(.5,9),'line-opacity':s.thin?.55:s.grid?.85:1}},
      {id:'road-major-casing',type:'line',source:'omt','source-layer':'transportation',filter:['all',notTunnel,majors],
        layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':s.casing,'line-width':s.thin||s.grid?0:w(2.4,16)}},
      {id:'road-major',type:'line',source:'omt','source-layer':'transportation',filter:['all',notTunnel,majors],
        layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':s.major,'line-width':s.thin?w(.8,2.6):s.grid?w(1.2,7):w(1.6,13)}},
      {id:'zona-fill',type:'fill',source:'zonas',paint:{'fill-color':s.zona||s.pin,'fill-opacity':.28}},
      {id:'rail',type:'line',source:'omt','source-layer':'transportation',filter:['==',['get','class'],'rail'],
        paint:{'line-color':s.rail,'line-width':1,'line-dasharray':[3,3]}},
      {id:'road-label',type:'symbol',source:'omt','source-layer':'transportation_name',minzoom:14,
        filter:['match',['get','class'],['primary','secondary','tertiary','minor'],true,false],
        layout:{'visibility':s.grid?'none':'visible','symbol-placement':'line','text-field':name,'text-font':['Noto Sans Regular'],'text-size':11,
          'text-transform':s.upper?'uppercase':'none','text-letter-spacing':s.upper?.08:0},
        paint:{'text-color':s.label,'text-halo-color':s.halo,'text-halo-width':1.4}},
      {id:'water-label',type:'symbol',source:'omt','source-layer':'water_name',
        layout:{'text-field':name,'text-font':['Noto Sans Italic'],'text-size':13},
        paint:{'text-color':k==='audaz'?'#ffffff':k==='verde'?'#9cc3ea':s.label,'text-halo-width':0}},
      {id:'place-label',type:'symbol',source:'omt','source-layer':'place',
        filter:['match',['get','class'],['city','town','village'],true,false],
        layout:{'text-field':name,'text-font':tf,
          'text-size':['match',['get','class'],'city',22,'town',16,13],
          'text-transform':s.upper?'uppercase':'none','text-letter-spacing':s.upper?.06:.01},
        paint:{'text-color':s.place,'text-halo-color':s.halo,'text-halo-width':s.upper?2:1.5}}
    ]
  };
}

/* ---------- Montaje ---------- */
let skin = 'audaz', barriosOn = true, hoverId = null, markers = [], activeEl = null;
const map = new maplibregl.Map({
  container:'map', style:buildStyle(skin), center:[-62.266,-38.715], zoom:13.4, minZoom:10, maxZoom:18,
  attributionControl:{compact:true,customAttribution:'OpenFreeMap © OpenMapTiles · Datos © OpenStreetMap'}
});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
map.on('error', e => { if(!map.loaded() && String(e.error||'').match(/fetch|network|Failed/i)) showErr(); });
function showErr(){ if(document.querySelector('.err'))return; const d=document.createElement('div'); d.className='err';
  d.innerHTML='No se pudo cargar el fondo del mapa.<br>Abrí el archivo con conexión a internet, desde Chrome o Firefox.'; document.querySelector('main').appendChild(d); }

function drawMarkers(){
  markers.forEach(m=>m.remove()); markers=[];
  const s = SKINS[skin];
  LUGARES.filter(l=>l.local!==false).forEach(l=>{
    const el = document.createElement('button'); el.className='pin'; el.setAttribute('aria-label',l.nombre);
    el.innerHTML = `<svg viewBox="${PIN_VB}">${pinSVG(l,s)}</svg>`;
    el.addEventListener('click',ev=>{ ev.stopPropagation(); openCard(l,el); });
    // la punta de la casita es la esquina de abajo a la izquierda del dibujo
    markers.push(new maplibregl.Marker({element:el,anchor:'bottom-left'}).setLngLat(l.ll).addTo(map));
  });
}
let popup = null;
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function openCard(l,el){
  if(popup) popup.remove();
  if(activeEl) activeEl.classList.remove('on'); activeEl = el; if(el) el.classList.add('on');
  const meta = 'Barrio ' + l.barrio + (l.nueva ? ' · Tienda nueva' : '') + (l.local===false ? ' · Zona aproximada' : '');
  const accion = l.tipo==='servicio' ? 'Ver servicio' : 'Ver tienda';
  popup = new maplibregl.Popup({className:'mapa-popup', offset: l.local===false ? [0,0] : [14,-44], anchor:'bottom', maxWidth:'360px', focusAfterOpen:false, closeOnClick:false})
    .setLngLat(l.ll)
    .setHTML(`<div class="pop-head"><div class="pop-logo" style="background:${l.color}">${esc(l.nombre[0])}</div>
      <div><p class="pop-name">${esc(l.nombre)}</p><div class="pop-meta">${esc(meta)}</div></div></div>
      <p class="pop-desc">${esc(l.desc)}</p><button class="pop-link" type="button">${accion} →</button>`)
    .addTo(map);
  popup.on('close', () => { if(el && activeEl===el){ el.classList.remove('on'); activeEl=null; } });
  map.easeTo({center:l.ll, offset:[0,110], duration:500});
}
map.on('click','zona-fill',e=>{ const l=LUGARES[e.features[0].properties.i]; if(l) openCard(l,null); });
map.on('mouseenter','zona-fill',()=>{ map.getCanvas().style.cursor='pointer'; });
map.on('mouseleave','zona-fill',()=>{ map.getCanvas().style.cursor=''; });
function closeCard(){ if(popup){ popup.remove(); popup=null; } }
map.on('click', e => { if(e.originalEvent.target.closest('.pin')) return; if(map.queryRenderedFeatures(e.point,{layers:['zona-fill']}).length) return; closeCard(); });

/* ---------- Nombres de barrio como HTML (para poder usar Inter) ---------- */
const PLAZA = [-62.2663,-38.7183]; // Plaza Rivadavia
function centro(geom){
  // Barrios partidos en varios pedazos: entre los pedazos grandes (al menos 1/5 del mayor),
  // el nombre va en el más cercano a la plaza, que es donde la gente lo espera
  const polys = geom.type==='Polygon' ? [geom.coordinates] : geom.coordinates;
  const partes = polys.map(pg=>{ const r=pg[0]; let A=0,cx=0,cy=0;
    for(let i=0;i<r.length-1;i++){ const [x1,y1]=r[i],[x2,y2]=r[i+1],f=x1*y2-x2*y1; A+=f; cx+=(x1+x2)*f; cy+=(y1+y2)*f; }
    return A ? {ll:[cx/(3*A),cy/(3*A)], area:Math.abs(A)} : null; }).filter(Boolean);
  if(!partes.length) return {ll:polys[0][0][0], area:0};
  const mayor = Math.max(...partes.map(p=>p.area));
  const d = ll => Math.hypot((ll[0]-PLAZA[0])*0.78, ll[1]-PLAZA[1]);
  const elegida = partes.filter(p=>p.area>=mayor/5).sort((a,b)=>d(a.ll)-d(b.ll))[0];
  return {ll:elegida.ll, area:mayor};
}
/* Nombre sin «Barrio»/«B°» adelante (en el sitio real esto queda corregido en Supabase) */
const sinPrefijo = n => n.replace(/^(barrio|b°)\s+/i,'').trim();
/* Una palabra por renglón. Las palabras cortas (de, del, la…) viajan pegadas a la siguiente,
   los números romanos (II, III) a la anterior, y si el nombre tiene « y » se parte ahí en dos renglones */
function partir(n){
  if(/\s+y\s+/.test(n)){ const i=n.search(/\s+y\s+/); return n.slice(0,i).trim()+'\n'+n.slice(i).trim(); }
  const w=n.split(/\s+/), out=[]; let pend='';
  w.forEach(p=>{
    if(/^(de|del|la|las|los|el|e)$/i.test(p)){ pend += p+' '; }
    else if(/^[IVX]+$/.test(p) && out.length && !pend){ out[out.length-1] += ' '+p; }
    else { out.push(pend+p); pend=''; }
  });
  if(pend) out.push(pend.trim());
  return out.join('\n');
}
const ETIQ = BARRIOS.features.map(f=>{ const c=centro(f.geometry); return {nombre:f.properties.nombre, ll:c.ll, area:c.area}; })
  .sort((a,b)=>b.area-a.area); // los barrios grandes tienen prioridad cuando dos nombres se pisan
ETIQ.forEach(e=>{
  const el=document.createElement('div'); el.className='barrio-lbl'; el.textContent=partir(sinPrefijo(e.nombre));
  e.el=el; e.mk=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat(e.ll).addTo(map);
});
function applyBarrios(){
  const z=map.getZoom(), root=document.getElementById('map');
  root.style.setProperty('--bfs', (12+Math.max(0,Math.min(1,(z-12)/4))*3.5)+'px');
  root.style.setProperty('--blbl', SKINS[skin].bLabel);
  const h=SKINS[skin].bHaloCss; root.style.setProperty('--bhalo', h ? [[-1,-1],[0,-1.4],[1,-1],[1.4,0],[1,1],[0,1.4],[-1,1],[-1.4,0]].map(([x,y])=>`${x}px ${y}px 0 ${h}`).join(',') : 'none');
  const show = barriosOn && z>=12.5, puestos=[];
  ETIQ.forEach(e=>{
    if(!show){ e.el.style.opacity=0; return; }
    const p=map.project(e.ll), w=e.el.offsetWidth/2+4, h=e.el.offsetHeight/2+3;
    const box=[p.x-w,p.y-h,p.x+w,p.y+h];
    const choca=puestos.some(b=>!(box[2]<b[0]||box[0]>b[2]||box[3]<b[1]||box[1]>b[3]));
    e.el.style.opacity = choca ? 0 : 1;
    if(!choca) puestos.push(box);
  });
}
let raf=0; map.on('move',()=>{ if(!raf) raf=requestAnimationFrame(()=>{raf=0; applyBarrios();}); });
map.on('load', applyBarrios);
document.fonts && document.fonts.ready.then(applyBarrios);

document.querySelectorAll('.modo button').forEach(b=>b.addEventListener('click',()=>{
  skin = b.dataset.skin;
  document.querySelectorAll('.modo button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  map.setStyle(buildStyle(skin)); drawMarkers(); applyBarrios();
}));
document.getElementById('t-barrios').addEventListener('click',e=>{
  barriosOn = !barriosOn; e.currentTarget.setAttribute('aria-pressed',String(barriosOn)); e.currentTarget.title='Nombres de barrios: '+(barriosOn?'prendidos':'apagados'); applyBarrios();
});
drawMarkers();
